<text x="300" y="531" font-family="Arial, sans-serif" font-size="31" font-weight="normal" fill="#152E42">Total assisted time 6. Difference 4 minutes = 40 percent in this example.</text>
<text x="45" y="672" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#152E42">Illustrative arithmetic, not observed Wooplix savings. Record quality and actual sample size.</text></svg>