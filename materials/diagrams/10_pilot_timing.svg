<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="1600" height="720" fill="white"/>
<text x="45" y="73" font-family="Arial, sans-serif" font-size="43" font-weight="bold" fill="#152E42">Measure the entire assisted task</text>
<text x="45" y="152" font-family="Arial, sans-serif" font-size="32" font-weight="normal" fill="#152E42">Synthetic timing example in minutes per task</text>
<text x="45" y="252" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#152E42">Baseline</text>
<rect x="300" y="200" width="1100" height="90" rx="15" fill="#E8F3F7" stroke="#087F8C" stroke-width="3"/>
<text x="330" y="256" font-family="Arial, sans-serif" font-size="31" font-weight="normal" fill="#152E42">10 minutes active work</text>
