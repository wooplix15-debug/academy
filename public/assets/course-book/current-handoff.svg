<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc"><title id="title">Current order-to-finance handoff</title><desc id="desc">Sales prepares and submits a confirmed order. Finance reviews it. Complete packets are accepted. Missing information returns to Sales and is resubmitted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#275d52"/></marker></defs><rect width="720" height="410" rx="16" fill="#f7faf8"/><rect x="25" y="35" width="200" height="65" rx="12" fill="#e9f5f2" stroke="#275d52"/><text x="125.0" y="72.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Written confirmation</text><rect x="260" y="35" width="200" height="65" rx="12" fill="#e9f5f2" stroke="#275d52"/><text x="360.0" y="72.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Sales prepares packet</text><rect x="495" y="35" width="200" height="65" rx="12" fill="#e9f5f2" stroke="#275d52"/><text x="595.0" y="72.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Sales sends packet</text><rect x="495" y="155" width="200" height="65" rx="12" fill="#e9f5f2" stroke="#275d52"/><text x="595.0" y="192.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Finance reviews</text><path d="M360.0,147 L460,187.5 L360.0,228 L260,187.5 Z" fill="#fff2da" stroke="#275d52"/><text x="360.0" y="192.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Complete?</text><rect x="25" y="155" width="200" height="65" rx="12" fill="#e9f5f2" stroke="#275d52"/><text x="125.0" y="192.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Finance accepts</text><rect x="260" y="300" width="200" height="65" rx="12" fill="#ffece9" stroke="#275d52"/><text x="360.0" y="337.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#102f29">Sales corrects packet</text><path d="M225 67 H255" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M460 67 H490" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 100 V150" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M495 188 H465" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 188 H230" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 220 V295" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M460 332 H595 V225" fill="none" stroke="#275d52" stroke-width="2" marker-end="url(#arrow)"/><text x="233" y="173" font-family="Arial" font-size="12">Yes</text><text x="370" y="264" font-family="Arial" font-size="12">No: return with reason</text><text x="605" y="287" font-family="Arial" font-size="12">Resend</text></svg>