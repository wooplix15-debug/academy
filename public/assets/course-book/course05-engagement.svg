<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc"><title id="title">Course 5 engagement learning path</title><desc id="desc">Four learning stages covering all sixteen chapters: client discovery, solution design, delivery validation and release with handover.</desc><rect width="960" height="250" rx="18" fill="#f2f7ee"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527d61"/></marker></defs><rect x="20" y="38" width="215" height="170" rx="12" fill="white" stroke="#b4c9b5"/><text x="38" y="72" font-family="Arial,sans-serif" font-size="12" fill="#527d61">CHAPTERS 01–04</text><text x="38" y="115" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18392f">Understand the client</text><text x="38" y="150" font-family="Arial,sans-serif" font-size="11" fill="#53655e">Discovery &amp; requirements</text><path d="M235 122 H252" stroke="#527d61" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="38" width="215" height="170" rx="12" fill="white" stroke="#b4c9b5"/><text x="273" y="72" font-family="Arial,sans-serif" font-size="12" fill="#527d61">CHAPTERS 05–08</text><text x="273" y="115" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18392f">Design the solution</text><text x="273" y="150" font-family="Arial,sans-serif" font-size="11" fill="#53655e">Scope, architecture &amp; data</text><path d="M470 122 H487" stroke="#527d61" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="38" width="215" height="170" rx="12" fill="white" stroke="#b4c9b5"/><text x="508" y="72" font-family="Arial,sans-serif" font-size="12" fill="#527d61">CHAPTERS 09–12</text><text x="508" y="115" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18392f">Plan &amp; validate</text><text x="508" y="150" font-family="Arial,sans-serif" font-size="11" fill="#53655e">Estimates, prototypes &amp; quality</text><pat