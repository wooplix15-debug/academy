<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251f">
  <title>Contact Vivek Pandey</title>
  <meta name="description" content="Contact Vivek Pandey about AI consulting, speaking or Academy courses.">
  <link rel="icon" href="/assets/vp-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/personal-brand.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="brand-header"><div class="shell nav-wrap">
  <a class="identity" href="/" aria-label="Vivek Pandey home"><span class="identity-mark">vp.</span><span>Vivek Pandey</span></a>
  <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="brand-nav"><span></span><span></span></button>
  <nav id="brand-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/ai-consulting">Consulting</a><a href="/ai-speaking">Speaking</a><a href="/academy">Academy</a><a href="/contact" class="nav-action" aria-current="page">Contact <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><use href="/assets/brand-icons.svg#arrow-up-right"></use></svg></span></a></nav>
</div></header>
<main id="main" class="enquiry-page shell">
  <header class="enquiry-title"><p class="overline">CONTACT</p><h1>Start a conversation.</h1><p>Share your details and choose a topic.</p></header>
  <div class="enquiry-grid"><form class="enquiry-form" id="enquiry-form">
    <label>Name<input name="name" autocomplete="name" maxlength="100" required></label>
    <label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="40" required></label>
    <label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
    <label>Topic<select name="topic" required><option value="" disabled selected>Choose a topic</option><option>AI consulting</option><option>Speaking</option><option>Academy</option><option>Other</option></select></label>
    <div class="wide enquiry-buttons"><button class="action" type="submit">Continue by email <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><use href="/assets/brand-icons.svg#arrow-up-right"></use></svg></span></button></div>
    <p class="wide enquiry-status" id="enquiry-status" role="status" aria-live="polite"></p>
  </form></div>
</main>
<footer class="brand-footer"><div class="shell">
  <a class="identity" href="/" aria-label="Vivek Pandey home"><span class="identity-mark">vp.</span><span>Vivek Pandey</span></a>
  <div><a href="/contact" aria-current="page">Contact</a><a href="/academy">Academy</a></div>
  <p>© <span data-brand-year>2026</span> Vivek Pandey</p>
</div></footer>
<script src="/personal-brand.js" defer></script>
</body>
</html>
